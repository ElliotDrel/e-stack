name: Installer regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node scripts/test-install-edge-cases.cjs
      - run: node scripts/test-prefix-safety.cjs
